apiVersion: v1
kind: ServiceAccount
metadata: { name: sandboxd, namespace: vyoma-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sandboxd-role, namespace: sandboxes }
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sandboxd-binding, namespace: sandboxes }
subjects:
  - kind: ServiceAccount
    name: sandboxd
    namespace: vyoma-system
roleRef: { kind: Role, name: sandboxd-role, apiGroup: rbac.authorization.k8s.io }